<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forex Factory Weekly News</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="popup-header">
        <h1 class="popup-title">ForexFactory 金融信息 v1004_1915</h1>
      </header>

      <section class="popup-toolbar">
        <button id="refresh-data" class="popup-refresh" type="button">重新获取</button>
        <label class="popup-local-time">
          <input type="checkbox" id="local-time">
          <span>本地时间</span>
        </label>
      </section>

      <section class="popup-loading" id="status">正在获取中...</section>

      <section class="popup-card popup-result-card">
        <div class="popup-days" id="result-days"></div>
      </section>

      <details class="popup-card popup-debug-card">
        <summary>
          调试信息
          <button id="copy-debug" type="button">复制</button>
        </summary>
        <pre id="debug-output" class="popup-debug-output"></pre>
      </details>
    </main>
    <script src="popup.js"></script>
  </body>
  </html>

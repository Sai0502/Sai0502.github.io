<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>MGC1! 4,559.50 Mock TradingView</title>
  <style>
    body {
      margin: 0;
      min-height: 900px;
      background: #111722;
      color: #dbe5f2;
      font-family: Arial, sans-serif;
    }
    .toolbar {
      padding: 12px;
      background: #151f2b;
    }
    .last-price {
      position: fixed;
      top: 12px;
      right: 18px;
      padding: 8px 12px;
      border: 1px solid #334155;
      border-radius: 6px;
      background: #0b1017;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 640px;
      margin-top: 54px;
      background: #0d141f;
    }
    .order-panel {
      padding: 12px;
    }
    .trade-panel {
      position: fixed;
      left: 18px;
      bottom: 18px;
      width: 240px;
      height: 40px;
      opacity: 0.01;
    }
    .stop-order {
      display: inline-flex;
      padding: 8px 12px;
      border: 1px solid #ef4444;
      border-radius: 6px;
    }
    .axis-label {
      position: fixed;
      right: 18px;
      color: #f8fafc;
      background: #111722;
      font-weight: 700;
    }
    .axis-label.top { top: 196px; }
    .axis-label.bottom { top: 596px; }
  </style>
</head>
<body>
  <div class="toolbar">TradingView Paper Trading Tradovate Position Long Stop Take Profit</div>
  <div class="last-price" aria-label="Last price 4,560.00">Last 4,560.00</div>
  <div class="trade-panel" aria-label="交易面板 MGC1! 订单 市场深度 卖出 3,978.50 买入 3,978.80 0.30 市价 限价 止损 价格 价格 Ask 数量类型 单位 单位 单位 7.96 USD 退出 止盈, 价格 281 ticks 止损, 价格 311 ticks 额外设置 有效时间 周 订单信息 保证金 7.96 / 100,217.04 杠杆 500:1 刻度值"></div>
  <canvas></canvas>
  <div class="axis-label top">4,600.00</div>
  <div class="axis-label bottom">4,500.00</div>
  <div class="order-panel">
    <button class="stop-order" aria-label="Stop loss 4548.00">Stop Loss 4548.00</button>
  </div>
  <script>
    window.__setMockPrice = price => {
      const el = document.querySelector('.last-price');
      const text = Number(price).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      el.textContent = `Last ${text}`;
      el.setAttribute('aria-label', `Last price ${text}`);
      document.title = `MGC1! ${text} Mock TradingView`;
    };
  </script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TopstepLock</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1 id="appTitle">TopstepLock v0930_1300</h1>
  </header>
  <main>
    <section class="row">
      <label class="time-label">锁定到（北京时间）</label>
      <input id="targetTime" type="text" inputmode="numeric" maxlength="5" placeholder="21:00" value="21:00">
    </section>
    <button id="lockBtn" class="lock-btn" type="button">立即锁定</button>
    <p id="status" class="status" aria-live="polite"></p>
    <button id="debugBtn" class="debug-btn" type="button">显示调试信息</button>
    <details id="debugDetails">
      <summary>调试信息（点开展开，可手动全选复制）</summary>
      <pre id="debugPreview" style="max-height:400px;overflow:auto;white-space:pre-wrap;word-break:break-all;font-size:11px;background:#1a1a1a;color:#ddd;padding:8px;border-radius:4px;">点上方按钮生成。</pre>
    </details>
    <p class="hint">流程：齿轮 → Lock Trading → Custom → 填时间 → Select All → 停在 Confirm 前</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>

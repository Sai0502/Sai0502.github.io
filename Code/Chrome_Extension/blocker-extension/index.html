<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>这是魔鬼的诱惑么</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%231a0505' stroke='%23b33' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23e8b04b'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@300;500;700;900&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #0a0304;
    overflow: hidden;
    font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
    color: #e8d5b0;
    -webkit-font-smoothing: antialiased;
  }

  /* 背景层：暗红光晕 */
  .glow {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 45% at 50% 55%, rgba(140, 20, 20, 0.35), transparent 70%),
      radial-gradient(ellipse 40% 30% at 50% 60%, rgba(232, 176, 75, 0.12), transparent 70%),
      #0a0304;
    animation: breathe 7s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.75; transform: scale(1); }
    50%      { opacity: 1;   transform: scale(1.06); }
  }

  /* 火星粒子画布 */
  #embers {
    position: fixed;
    inset: 0;
    pointer-events: none;
  }

  /* 中心内容 */
  .stage {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 24px;
    z-index: 2;
  }

  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.6em;
    color: rgba(232, 213, 176, 0.35);
    text-transform: uppercase;
    margin-bottom: 36px;
    opacity: 0;
    animation: fadeIn 3s ease 0.5s forwards;
    padding-left: 0.6em; /* 抵消字间距 */
  }

  h1 {
    font-weight: 500;
    font-size: clamp(30px, 6.5vw, 84px);
    line-height: 1.4;
    letter-spacing: 0.08em;
    color: #e8d5b0;
    text-shadow:
      0 0 20px rgba(232, 176, 75, 0.25),
      0 0 60px rgba(180, 30, 30, 0.4);
    opacity: 0;
    animation: fadeIn 3.5s ease 1.2s forwards;
  }

  h1 .em {
    font-weight: 900;
    color: #d94436;
    font-style: normal;
  }

  .whisper {
    margin-top: 48px;
    font-size: 13px;
    font-weight: 300;
    color: rgba(232, 213, 176, 0.4);
    letter-spacing: 0.2em;
    opacity: 0;
    animation: fadeIn 3s ease 3s forwards;
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  /* 底部一行极小的脚注，不抢戏 */
  footer {
    position: fixed;
    bottom: 20px;
    left: 0; right: 0;
    text-align: center;
    font-size: 10px;
    letter-spacing: 0.3em;
    color: rgba(232, 213, 176, 0.18);
    z-index: 2;
  }

  @media (prefers-reduced-motion: reduce) {
    .glow, h1, .eyebrow, .whisper { animation: none !important; opacity: 1 !important; }
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <canvas id="embers"></canvas>

  <main class="stage">
    <div class="eyebrow">Quid vis</div>
    <h1>这是<span class="em">魔鬼</span>的诱惑么</h1>
    <div class="whisper">— 还是你自己，本就想要 —</div>
  </main>

  <footer>·  NON  ·  RESISTAS  ·</footer>

<script src="embers.js"></script>
</body>
</html>
